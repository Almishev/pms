name: Publish to Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image name
        id: image
        run: echo "name=${DOCKERHUB_USERNAME}" >> "$GITHUB_OUTPUT"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Publish backend
        uses: docker/build-push-action@v6
        with:
          context: ./hotel-pms-backend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}/hotel-pms-backend:latest
            ${{ steps.image.outputs.name }}/hotel-pms-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Publish frontend
        uses: docker/build-push-action@v6
        with:
          context: ./hotel-pms-frontend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}/hotel-pms-frontend:latest
            ${{ steps.image.outputs.name }}/hotel-pms-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
