name: Deploy to Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # Позволява ръчно стартиране от GitHub UI

jobs:
  deploy:
    name: Deploy Hotel PMS to Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
      
      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} bash << 'DEPLOY_SCRIPT'
            set -e
            echo "=========================================="
            echo "GitHub Actions Deployment Started"
            echo "=========================================="
            
            # Навигиране до проекта
            cd ${DEPLOY_PATH}
            
            # Backup на базата данни
            echo ""
            echo "Създаване на backup..."
            BACKUP_FILE="backup_$(date +%Y%m%d_%H%M%S).sql"
            docker compose exec -T postgres pg_dump -U hotelpms_user hotel_pms > "$BACKUP_FILE" 2>/dev/null || echo "Backup пропуснат"
            echo "Backup: $BACKUP_FILE"
            
            # Pull новия код
            echo ""
            echo "Изтегляне на новия код..."
            git fetch origin
            git reset --hard origin/main || git reset --hard origin/master
            
            # Спиране на контейнерите
            echo ""
            echo "Спиране на контейнерите..."
            docker compose down || true
            
            # Преизграждане
            echo ""
            echo "Преизграждане на Docker images..."
            docker compose build --no-cache
            
            # Стартиране
            echo ""
            echo "Стартиране на контейнерите..."
            docker compose up -d
            
            # Изчакване за стартиране
            echo ""
            echo "Изчакване за стартиране..."
            sleep 15
            
            # Проверка на статуса
            echo ""
            echo "=========================================="
            echo "Статус на контейнерите:"
            echo "=========================================="
            docker compose ps
            
            # Проверка на health
            echo ""
            echo "Проверка на backend health..."
            sleep 5
            curl -f http://localhost:8085/actuator/health || echo "Backend health check failed"
            
            echo ""
            echo "=========================================="
            echo "Deployment завършен успешно!"
            echo "=========================================="
          DEPLOY_SCRIPT
      
      - name: Deployment Summary
        run: |
          echo "✅ Deployment успешно завършен!"
          echo "Backend: http://${{ secrets.SERVER_HOST }}:8085"
          echo "Frontend: http://${{ secrets.SERVER_HOST }}:3000"

