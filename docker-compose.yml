version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: hotel-pms-db
    environment:
      POSTGRES_DB: hotel_pms
      POSTGRES_USER: hotelpms_user
      POSTGRES_PASSWORD: hotelpms_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - ./init-users.sql:/docker-entrypoint-initdb.d/init-users.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelpms_user -d hotel_pms"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hotel-pms-network

  # Backend Service
  backend:
    image: ${DOCKERHUB_USER:-antonalmishev}/hrs:backend
    build:
      context: ./hotel-pms-backend
      dockerfile: Dockerfile
    container_name: hotel-pms-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hotel_pms
      SPRING_DATASOURCE_USERNAME: hotelpms_user
      SPRING_DATASOURCE_PASSWORD: hotelpms_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_key_in_production_minimum_256_bits}
      JWT_EXPIRATION: 86400000
      CORS_ALLOWED_ORIGINS: "*"
      LOGGING_LEVEL_COM_HOTEL_PMS: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: WARN
      PMS_BACKUP_ENABLED: "false"
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hotel-pms-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Service
  frontend:
    image: ${DOCKERHUB_USER:-antonalmishev}/hrs:frontend
    build:
      context: ./hotel-pms-frontend
      dockerfile: Dockerfile
    container_name: hotel-pms-frontend
    ports:
      - "3003:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - hotel-pms-network

volumes:
  postgres_data:
    driver: local

networks:
  hotel-pms-network:
    driver: bridge

