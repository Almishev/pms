# Server Configuration
server.port=8085
spring.application.name=hotel-pms-backend

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/hotel_pms
spring.datasource.username=user1
spring.datasource.password=asroma
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# SQL Initialization - автоматично изпълнява data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT Configuration
jwt.secret=mySecretKeyForJWTTokenGenerationAndValidationMustBeAtLeast256BitsLong
jwt.expiration=86400000

# Shared secret for the restaurant POS. Override with PMS_INTEGRATION_KEY.
pms.integration.key=${PMS_INTEGRATION_KEY:hotel-restaurant-dev-key}

# CORS Configuration
cors.allowed-origins=http://localhost:3003

# Logging
logging.level.com.hotel.pms=DEBUG
logging.level.org.springframework.security=DEBUG

# Бекъп върху закачен външен диск. Празен път значи автоматично търсене на флашка.
pms.backup.enabled=true
pms.backup.cron=0 35 23 * * *
pms.backup.directory=
pms.backup.pg-dump=

