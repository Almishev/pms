# Server Configuration
server.port=8085
spring.application.name=hotel-pms-backend

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/hotel_pms
spring.datasource.username=user1
spring.datasource.password=asroma
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=mySecretKeyForJWTTokenGenerationAndValidationMustBeAtLeast256BitsLong
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:3000

# Logging
logging.level.com.hotel.pms=DEBUG
logging.level.org.springframework.security=DEBUG

